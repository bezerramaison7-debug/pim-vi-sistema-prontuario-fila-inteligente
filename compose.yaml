services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?defina SQL_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - dados:/var/opt/mssql
volumes:
  dados:
