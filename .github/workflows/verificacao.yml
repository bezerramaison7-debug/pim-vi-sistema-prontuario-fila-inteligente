name: Verificação PIM VI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQL_PASSWORD: "PimCI_LocalOnly_624!"
      APP_SECRET: "somente-ci-descartavel-20c8a3077f32"
      DEMO_PASSWORD: "DemonstracaoCI_Local_624!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: docker compose up -d
      - run: |
          for tentativa in $(seq 1 25); do
            if python -m flask --app clinica init-db; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: TESTE_SQL_SERVER=1 python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m flask --app clinica seed-demo
          python -m flask --app clinica run > servidor.log 2>&1 &
          for tentativa in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/saude; then break; fi
            sleep 1
          done
          EVIDENCIAS=tmp-evidencias python tests/navegador.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-navegador
          path: |
            tmp-evidencias/
            servidor.log
